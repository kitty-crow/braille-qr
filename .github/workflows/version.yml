name: Chore version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  version:
    uses: kitty-crow/github-pages-template/.github/workflows/version.yml@7f8266bfa146476784a4435ca5f8d8fac29c223e
    with:
      bump: ${{ inputs.bump }}
      bun-version: "1.3.14"
      version-command: "bun vendor/pages/src/cli.ts version"
      check-command: "bun run check && bun run site:check"
      build-command: "bun run site:build && bun run site:test"
      artifact-path: "site/dist"
