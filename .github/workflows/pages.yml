name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/core/**"
      - "src/embed/**"
      - "src/types.ts"
      - "src/ext/qrcode.d.ts"
      - "templates/embed/**"
      - "vendor/pages"
      - ".gitmodules"
      - "pages.config.ts"
      - "version.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Check and build
        run: bun run site:ci
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
