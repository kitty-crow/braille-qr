<div
  data-braille-qr
  data-text="{{TEXT}}"
  data-scale="{{SCALE}}"
  data-ec="{{EC}}"
  data-draw="{{DRAW}}"
  data-edge="{{EDGE}}"
  data-theme="{{THEME}}"
  data-query="{{QUERY}}"
  style="{{STYLE}}"
>
  <template data-braille-qr-template>
    <link rel="stylesheet" href="{{CSS_SRC}}">
    <div class="frame">
      <div class="code" data-braille-qr-root></div>
    </div>
  </template>
  <script src="{{LOAD_SRC}}" data-api="{{API_SRC}}"></script>
</div>
